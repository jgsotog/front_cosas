<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Cosas - Categorías, Clientes, Ventas</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Tarjetas */
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; color: #1a73e8; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        .card h3 { color: #333; margin-top: 0; }
        
        /* Formularios */
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
        input, select, button { padding: 10px 15px; border-radius: 8px; font-size: 14px; }
        input, select { border: 1px solid #ddd; flex: 1; min-width: 150px; }
        button { background: #1a73e8; color: white; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1557b0; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #bb2d3b; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #1e7e34; }
        
        /* Listas */
        .lista { display: flex; flex-direction: column; gap: 10px; }
        .item { background: #f8f9fa; padding: 12px; border-radius: 8px; border-left: 4px solid #1a73e8; }
        .item button { margin-left: 10px; padding: 5px 10px; font-size: 12px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .logout { background: #dc3545; padding: 8px 20px; }
        
        /* Mensajes */
        .message { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; z-index: 1000; animation: fadeOut 3s forwards; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        
        /* Grid para 3 columnas */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        
        .badge { background: #e9ecef; padding: 3px 8px; border-radius: 12px; font-size: 12px; margin-left: 10px; }
        
        hr { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- SECCIÓN AUTH (Login/Registro) -->
        <div id="auth-section" class="card">
            <h2>📋 Sistema de Gestión</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <h3>📝 Registro</h3>
                    <input type="text" id="reg-nombre" placeholder="Nombre completo" style="width: 100%; margin-bottom: 10px;">
                    <input type="email" id="reg-email" placeholder="Email" style="width: 100%; margin-bottom: 10px;">
                    <input type="password" id="reg-password" placeholder="Contraseña" style="width: 100%; margin-bottom: 10px;">
                    <button id="btn-register" style="width: 100%;">Registrarse</button>
                </div>
                <div>
                    <h3>🔐 Iniciar Sesión</h3>
                    <input type="email" id="login-email" placeholder="Email" style="width: 100%; margin-bottom: 10px;">
                    <input type="password" id="login-password" placeholder="Contraseña" style="width: 100%; margin-bottom: 10px;">
                    <button id="btn-login" style="width: 100%;">Iniciar Sesión</button>
                </div>
            </div>
        </div>

        <!-- SECCIÓN PRINCIPAL (CRUD) - oculta hasta login -->
        <div id="crud-section" style="display: none;">
            <div class="header">
                <h2>🚀 Panel de Control</h2>
                <button class="logout" id="btn-logout">Cerrar Sesión</button>
            </div>

            <div class="grid-3">
                <!-- CARD CATEGORÍAS -->
                <div class="card">
                    <h2>🏷️ Categorías</h2>
                    <div class="form-group">
                        <input type="text" id="cat-nombre" placeholder="Nombre">
                        <input type="text" id="cat-descripcion" placeholder="Descripción">
                        <button id="btn-crear-categoria">➕ Agregar</button>
                    </div>
                    <h3>Lista de Categorías</h3>
                    <div id="lista-categorias" class="lista"></div>
                </div>

                <!-- CARD CLIENTES -->
                <div class="card">
                    <h2>👥 Clientes</h2>
                    <div class="form-group">
                        <input type="text" id="cli-nombre" placeholder="Nombre">
                        <input type="email" id="cli-email" placeholder="Email">
                        <input type="text" id="cli-telefono" placeholder="Teléfono">
                        <button id="btn-crear-cliente">➕ Agregar</button>
                    </div>
                    <h3>Lista de Clientes</h3>
                    <div id="lista-clientes" class="lista"></div>
                </div>

                <!-- CARD VENTAS -->
                <div class="card">
                    <h2>💰 Ventas</h2>
                    <div class="form-group">
                        <select id="venta-cliente-id">
                            <option value="">Seleccionar cliente</option>
                        </select>
                        <input type="number" id="venta-total" placeholder="Total Bs.">
                        <input type="text" id="venta-items" placeholder="Items (ej: Silla, Mesa)">
                        <button id="btn-crear-venta">💵 Registrar</button>
                    </div>
                    <h3>Historial de Ventas</h3>
                    <div id="lista-ventas" class="lista"></div>
                </div>
            </div>

            <!-- Sección Muebles (la original) -->
            <div class="card">
                <h2>🪑 Muebles (CRUD original)</h2>
                <div class="form-group">
                    <input type="text" id="mueble-nombre" placeholder="Nombre">
                    <input type="text" id="mueble-tipo" placeholder="Tipo (cocina, sala, etc)">
                    <input type="number" id="mueble-costo" placeholder="Costo">
                    <button id="btn-crear-mueble">➕ Agregar Mueble</button>
                </div>
                <h3>Lista de Muebles</h3>
                <div id="lista-muebles" class="lista"></div>
            </div>
        </div>
    </div>

    <div id="message-container"></div>

    <script>
        // ========== CONFIGURACIÓN ==========
        const API_AUTH = 'https://crud-cosas-y65y.onrender.com';  // API de autenticación
        const API_BACKEND = 'http://localhost:3000';              // Tu backend local con endpoints nuevos

        // Mostrar mensajes
        function showMessage(msg, isError = true) {
            const container = document.getElementById('message-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isError ? 'error' : 'success'}`;
            msgDiv.textContent = msg;
            container.appendChild(msgDiv);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        // Obtener token
        function getToken() {
            return localStorage.getItem('token');
        }

        // Headers con autenticación
        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getToken()}`
            };
        }

        // ========== REGISTRO Y LOGIN ==========
        async function register() {
            const nombre = document.getElementById('reg-nombre').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            if (!nombre || !email || !password) {
                showMessage('Todos los campos son requeridos');
                return;
            }
            try {
                const res = await fetch(`${API_AUTH}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });
                if (res.ok) {
                    showMessage('Registro exitoso. Ahora inicia sesión', false);
                    document.getElementById('reg-nombre').value = '';
                    document.getElementById('reg-email').value = '';
                    document.getElementById('reg-password').value = '';
                } else {
                    const data = await res.json();
                    showMessage(data.message || 'Error en registro');
                }
            } catch (error) {
                showMessage('Error de conexión');
            }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (!email || !password) {
                showMessage('Email y password requeridos');
                return;
            }
            try {
                const res = await fetch(`${API_AUTH}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('email', email);
                    showMessage('Login exitoso', false);
                    mostrarCRUD();
                    await Promise.all([
                        listarCategorias(),
                        listarClientes(),
                        listarVentas(),
                        listarMuebles()
                    ]);
                } else {
                    showMessage(data.message || 'Credenciales inválidas');
                }
            } catch (error) {
                showMessage('Error de conexión');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('email');
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('crud-section').style.display = 'none';
            showMessage('Sesión cerrada', false);
        }

        function mostrarCRUD() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('crud-section').style.display = 'block';
        }

        // ========== CRUD CATEGORÍAS ==========
        async function listarCategorias() {
            try {
                const res = await fetch(`${API_BACKEND}/categorias`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                const container = document.getElementById('lista-categorias');
                if (data.length === 0) {
                    container.innerHTML = '<p class="item">No hay categorías</p>';
                } else {
                    container.innerHTML = data.map(c => `
                        <div class="item">
                            <strong>${c.nombre}</strong> <span class="badge">ID: ${c.id}</span>
                            <p style="margin: 5px 0 0 0; font-size: 13px; color: #666;">${c.descripcion || 'Sin descripción'}</p>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showMessage('Error al conectar con backend de categorías');
            }
        }

        async function crearCategoria() {
            const nombre = document.getElementById('cat-nombre').value;
            const descripcion = document.getElementById('cat-descripcion').value;
            if (!nombre) {
                showMessage('Nombre de categoría requerido');
                return;
            }
            try {
                await fetch(`${API_BACKEND}/categorias`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ nombre, descripcion })
                });
                document.getElementById('cat-nombre').value = '';
                document.getElementById('cat-descripcion').value = '';
                await listarCategorias();
                showMessage('Categoría creada', false);
            } catch (error) {
                showMessage('Error al crear categoría');
            }
        }

        // ========== CRUD CLIENTES ==========
        async function listarClientes() {
            try {
                const res = await fetch(`${API_BACKEND}/clientes`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                const container = document.getElementById('lista-clientes');
                const select = document.getElementById('venta-cliente-id');
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="item">No hay clientes</p>';
                    select.innerHTML = '<option value="">No hay clientes disponibles</option>';
                } else {
                    container.innerHTML = data.map(c => `
                        <div class="item">
                            <strong>${c.nombre}</strong> <span class="badge">${c.email}</span>
                            <p style="margin: 5px 0 0 0; font-size: 13px; color: #666;">📞 ${c.telefono || 'Sin teléfono'}</p>
                        </div>
                    `).join('');
                    select.innerHTML = '<option value="">Seleccionar cliente</option>' + 
                        data.map(c => `<option value="${c.id}">${c.nombre} - ${c.email}</option>`).join('');
                }
            } catch (error) {
                showMessage('Error al conectar con backend de clientes');
            }
        }

        async function crearCliente() {
            const nombre = document.getElementById('cli-nombre').value;
            const email = document.getElementById('cli-email').value;
            const telefono = document.getElementById('cli-telefono').value;
            if (!nombre || !email) {
                showMessage('Nombre y email requeridos');
                return;
            }
            try {
                await fetch(`${API_BACKEND}/clientes`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ nombre, email, telefono })
                });
                document.getElementById('cli-nombre').value = '';
                document.getElementById('cli-email').value = '';
                document.getElementById('cli-telefono').value = '';
                await listarClientes();
                showMessage('Cliente creado', false);
            } catch (error) {
                showMessage('Error al crear cliente');
            }
        }

        // ========== CRUD VENTAS ==========
        async function listarVentas() {
            try {
                const res = await fetch(`${API_BACKEND}/ventas`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                const container = document.getElementById('lista-ventas');
                if (data.length === 0) {
                    container.innerHTML = '<p class="item">No hay ventas registradas</p>';
                } else {
                    container.innerHTML = data.map(v => `
                        <div class="item">
                            <strong>Venta #${v.id}</strong> <span class="badge">${v.fecha}</span>
                            <p style="margin: 5px 0 0 0;">Cliente: ${v.clienteNombre || 'ID: ' + v.clienteId}</p>
                            <p style="margin: 5px 0 0 0;">Total: Bs. ${v.total}</p>
                            <p style="margin: 5px 0 0 0; font-size: 12px;">Items: ${v.items ? v.items.join(', ') : 'Ninguno'}</p>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showMessage('Error al conectar con backend de ventas');
            }
        }

        async function crearVenta() {
            const clienteId = document.getElementById('venta-cliente-id').value;
            const total = parseFloat(document.getElementById('venta-total').value);
            const itemsRaw = document.getElementById('venta-items').value;
            if (!clienteId) {
                showMessage('Seleccione un cliente');
                return;
            }
            if (!total || total <= 0) {
                showMessage('Total válido requerido');
                return;
            }
            const items = itemsRaw ? itemsRaw.split(',').map(i => i.trim()) : [];
            try {
                await fetch(`${API_BACKEND}/ventas`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ clienteId: parseInt(clienteId), total, items })
                });
                document.getElementById('venta-cliente-id').value = '';
                document.getElementById('venta-total').value = '';
                document.getElementById('venta-items').value = '';
                await listarVentas();
                showMessage('Venta registrada', false);
            } catch (error) {
                showMessage('Error al registrar venta');
            }
        }

        // ========== CRUD MUEBLES (original con API de autenticación) ==========
        async function listarMuebles() {
            try {
                const res = await fetch(`${API_AUTH}/muebles`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                const container = document.getElementById('lista-muebles');
                if (data.length === 0) {
                    container.innerHTML = '<p class="item">No hay muebles registrados</p>';
                } else {
                    container.innerHTML = data.map(m => `
                        <div class="item">
                            <strong>${m.nombre || 'Sin nombre'}</strong> <span class="badge">${m.tipo || 'Sin tipo'}</span>
                            <p style="margin: 5px 0 0 0;">Costo: Bs. ${m.costo || 0}</p>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showMessage('Error al listar muebles');
            }
        }

        async function crearMueble() {
            const nombre = document.getElementById('mueble-nombre').value;
            const tipo = document.getElementById('mueble-tipo').value;
            const costo = parseFloat(document.getElementById('mueble-costo').value);
            if (!nombre || !tipo || !costo) {
                showMessage('Todos los campos del mueble son requeridos');
                return;
            }
            try {
                await fetch(`${API_AUTH}/muebles`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ nombre, tipo, costo })
                });
                document.getElementById('mueble-nombre').value = '';
                document.getElementById('mueble-tipo').value = '';
                document.getElementById('mueble-costo').value = '';
                await listarMuebles();
                showMessage('Mueble creado', false);
            } catch (error) {
                showMessage('Error al crear mueble');
            }
        }

        // ========== EVENTOS ==========
        document.getElementById('btn-register').addEventListener('click', register);
        document.getElementById('btn-login').addEventListener('click', login);
        document.getElementById('btn-logout').addEventListener('click', logout);
        document.getElementById('btn-crear-categoria').addEventListener('click', crearCategoria);
        document.getElementById('btn-crear-cliente').addEventListener('click', crearCliente);
        document.getElementById('btn-crear-venta').addEventListener('click', crearVenta);
        document.getElementById('btn-crear-mueble').addEventListener('click', crearMueble);

        // Verificar sesión al cargar
        if (getToken()) {
            mostrarCRUD();
            listarCategorias();
            listarClientes();
            listarVentas();
            listarMuebles();
        }
    </script>
</body>
</html>
